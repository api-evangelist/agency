description: Agency (agency.inc) builds Kai, an autonomous AI co-worker for customer success
  — an AI agent that works a company's entire book of B2B SaaS accounts, monitoring product
  usage, surfacing churn and expansion signals early, and running personalized onboarding,
  adoption, and renewal outreach so revenue and customer-success teams have command over
  their book. Agency raised a $20M Series A led by Menlo Ventures with participation from
  Sequoia Capital, Felicis, Snowflake Ventures, and Databricks Ventures. It is a demo-led
  enterprise product and does not currently publish a public API or developer program;
  this profile captures its identity and security posture.
